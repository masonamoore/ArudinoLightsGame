<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Elegoo Mega 2560 breadboard wiring diagram</title>
  <desc id="desc">Breadboard coordinate wiring for the Arduino light recorder game using Mega pins 2, 3, 4, 5, 9, 22, 24, 26, 28, 30, 32, 34, 36, 5V, and GND.</desc>
  <defs>
    <style>
      .label { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14212b; }
      .small { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #314252; }
      .tiny { font: 600 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #314252; }
      .board { fill: #d8f1ea; stroke: #176a5d; stroke-width: 3; }
      .breadboard { fill: #fbfdff; stroke: #7b8b9c; stroke-width: 3; }
      .pin { fill: #ffffff; stroke: #6b7d8f; stroke-width: 1.5; }
      .hole { fill: #ffffff; stroke: #b7c2cc; stroke-width: 1; }
      .rail-red { stroke: #d92d20; stroke-width: 6; }
      .rail-blue { stroke: #1570ef; stroke-width: 6; }
      .wire-red { stroke: #d92d20; stroke-width: 4; fill: none; }
      .wire-yellow { stroke: #d89b00; stroke-width: 4; fill: none; }
      .wire-green { stroke: #079455; stroke-width: 4; fill: none; }
      .wire-blue { stroke: #1570ef; stroke-width: 4; fill: none; }
      .wire-black { stroke: #182230; stroke-width: 4; fill: none; }
      .wire-purple { stroke: #7a4dd8; stroke-width: 3; fill: none; }
      .wire-gray { stroke: #667085; stroke-width: 3; fill: none; }
      .wire-orange { stroke: #f97316; stroke-width: 3; fill: none; }
      .resistor { fill: #f4d2a1; stroke: #9b6a24; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#eef3f6"/>
  <text x="48" y="54" class="label" font-size="30">Elegoo Mega Light Recorder Wiring</text>
  <text x="48" y="84" class="small">Use plain Mega pin numbers. Red rail is 5V charge. Blue rail is GND.</text>

  <rect x="48" y="130" width="310" height="630" rx="18" class="board"/>
  <text x="78" y="170" class="label">Elegoo Mega 2560</text>
  <text x="78" y="198" class="small">Controller board pin labels</text>

  <g id="mega-pins">
    <rect x="290" y="240" width="46" height="24" rx="4" class="pin"/><text x="307" y="257" class="tiny">2</text>
    <rect x="290" y="272" width="46" height="24" rx="4" class="pin"/><text x="307" y="289" class="tiny">3</text>
    <rect x="290" y="304" width="46" height="24" rx="4" class="pin"/><text x="307" y="321" class="tiny">4</text>
    <rect x="290" y="336" width="46" height="24" rx="4" class="pin"/><text x="307" y="353" class="tiny">5</text>
    <rect x="290" y="386" width="46" height="24" rx="4" class="pin"/><text x="307" y="403" class="tiny">9</text>
    <rect x="290" y="436" width="46" height="24" rx="4" class="pin"/><text x="298" y="453" class="tiny">GND</text>
    <rect x="290" y="468" width="46" height="24" rx="4" class="pin"/><text x="300" y="485" class="tiny">5V</text>
    <rect x="290" y="524" width="46" height="24" rx="4" class="pin"/><text x="300" y="541" class="tiny">22</text>
    <rect x="290" y="556" width="46" height="24" rx="4" class="pin"/><text x="300" y="573" class="tiny">24</text>
    <rect x="290" y="588" width="46" height="24" rx="4" class="pin"/><text x="300" y="605" class="tiny">26</text>
    <rect x="290" y="620" width="46" height="24" rx="4" class="pin"/><text x="300" y="637" class="tiny">28</text>
    <rect x="104" y="524" width="46" height="24" rx="4" class="pin"/><text x="114" y="541" class="tiny">30</text>
    <rect x="104" y="556" width="46" height="24" rx="4" class="pin"/><text x="114" y="573" class="tiny">32</text>
    <rect x="104" y="588" width="46" height="24" rx="4" class="pin"/><text x="114" y="605" class="tiny">34</text>
    <rect x="104" y="620" width="46" height="24" rx="4" class="pin"/><text x="114" y="637" class="tiny">36</text>
  </g>

  <rect x="430" y="125" width="610" height="650" rx="14" class="breadboard"/>
  <text x="460" y="162" class="label">Breadboard</text>
  <text x="462" y="188" class="small">Rows are the printed breadboard numbers</text>
  <line x1="472" y1="220" x2="998" y2="220" class="rail-red"/>
  <line x1="472" y1="735" x2="998" y2="735" class="rail-blue"/>
  <text x="482" y="211" class="small">red + rail: Mega 5V</text>
  <text x="482" y="762" class="small">blue - rail: Mega GND</text>

  <g id="row-labels">
    <text x="444" y="292" class="tiny">6</text>
    <text x="444" y="342" class="tiny">8</text>
    <text x="438" y="392" class="tiny">10</text>
    <text x="438" y="442" class="tiny">12</text>
    <text x="438" y="542" class="tiny">16</text>
    <text x="438" y="612" class="tiny">21</text>
    <text x="438" y="632" class="tiny">22</text>
    <text x="438" y="652" class="tiny">23</text>
    <text x="438" y="672" class="tiny">24</text>
    <text x="438" y="692" class="tiny">25</text>
    <text x="438" y="712" class="tiny">26</text>
    <text x="1010" y="612" class="tiny">27</text>
    <text x="1010" y="632" class="tiny">28</text>
  </g>

  <g id="breadboard-holes">
    <circle cx="520" cy="285" r="7" class="hole"/><text x="510" y="274" class="tiny">6a</text>
    <circle cx="650" cy="285" r="7" class="hole"/><text x="640" y="274" class="tiny">6f</text>
    <circle cx="920" cy="285" r="7" class="hole"/><text x="910" y="274" class="tiny">6j</text>
    <circle cx="520" cy="335" r="7" class="hole"/><text x="510" y="324" class="tiny">8a</text>
    <circle cx="650" cy="335" r="7" class="hole"/><text x="640" y="324" class="tiny">8f</text>
    <circle cx="920" cy="335" r="7" class="hole"/><text x="910" y="324" class="tiny">8j</text>
    <circle cx="520" cy="385" r="7" class="hole"/><text x="507" y="374" class="tiny">10a</text>
    <circle cx="650" cy="385" r="7" class="hole"/><text x="637" y="374" class="tiny">10f</text>
    <circle cx="920" cy="385" r="7" class="hole"/><text x="907" y="374" class="tiny">10j</text>
    <circle cx="520" cy="435" r="7" class="hole"/><text x="507" y="424" class="tiny">12a</text>
    <circle cx="650" cy="435" r="7" class="hole"/><text x="637" y="424" class="tiny">12f</text>
    <circle cx="920" cy="435" r="7" class="hole"/><text x="907" y="424" class="tiny">12j</text>
    <circle cx="520" cy="535" r="7" class="hole"/><text x="507" y="524" class="tiny">16a</text>
    <circle cx="920" cy="535" r="7" class="hole"/><text x="907" y="524" class="tiny">16j</text>
  </g>

  <g id="led-components">
    <rect x="548" y="277" width="58" height="16" rx="4" class="resistor"/><circle cx="650" cy="285" r="22" fill="#d92d20" stroke="#831f16" stroke-width="3"/><text x="682" y="291" class="small">LED 1 row 6</text>
    <rect x="548" y="327" width="58" height="16" rx="4" class="resistor"/><circle cx="650" cy="335" r="22" fill="#d89b00" stroke="#8a6100" stroke-width="3"/><text x="682" y="341" class="small">LED 2 row 8</text>
    <rect x="548" y="377" width="58" height="16" rx="4" class="resistor"/><circle cx="650" cy="385" r="22" fill="#079455" stroke="#05603a" stroke-width="3"/><text x="682" y="391" class="small">LED 3 row 10</text>
    <rect x="548" y="427" width="58" height="16" rx="4" class="resistor"/><circle cx="650" cy="435" r="22" fill="#1570ef" stroke="#1849a9" stroke-width="3"/><text x="682" y="441" class="small">LED 4 row 12</text>
  </g>

  <path d="M336 252 C410 252 450 285 520 285" class="wire-red"/>
  <path d="M336 284 C410 300 450 335 520 335" class="wire-yellow"/>
  <path d="M336 316 C410 350 450 385 520 385" class="wire-green"/>
  <path d="M336 348 C410 400 450 435 520 435" class="wire-blue"/>
  <path d="M920 285 L958 285 L958 735" class="wire-black"/>
  <path d="M920 335 L948 335 L948 735" class="wire-black"/>
  <path d="M920 385 L938 385 L938 735" class="wire-black"/>
  <path d="M920 435 L928 435 L928 735" class="wire-black"/>
  <path d="M336 448 C390 500 440 735 472 735" class="wire-black"/>
  <path d="M336 480 C390 470 430 220 472 220" class="wire-red"/>

  <g id="buzzer">
    <circle cx="650" cy="535" r="24" fill="#ffffff" stroke="#6b7d8f" stroke-width="3"/>
    <text x="686" y="541" class="small">Buzzer row 16</text>
    <path d="M336 398 C430 470 500 535 520 535" class="wire-orange"/>
    <path d="M920 535 L912 535 L912 735" class="wire-black"/>
  </g>

  <rect x="1100" y="130" width="220" height="270" rx="16" fill="#ffffff" stroke="#7b8b9c" stroke-width="3"/>
  <text x="1134" y="170" class="label">4x4 Keypad</text>
  <text x="1124" y="198" class="small">Ribbon facing you</text>
  <text x="1124" y="220" class="small">left to right: wires 1-8</text>
  <text x="1126" y="260" class="tiny">1  2  3  4  5  6  7  8</text>
  <text x="1126" y="286" class="tiny">R1 R2 R3 R4 C1 C2 C3 C4</text>

  <g id="keypad-rows">
    <circle cx="520" cy="605" r="6" class="hole"/><text x="536" y="610" class="tiny">21e wire 1</text>
    <circle cx="520" cy="625" r="6" class="hole"/><text x="536" y="630" class="tiny">22e wire 2</text>
    <circle cx="520" cy="645" r="6" class="hole"/><text x="536" y="650" class="tiny">23e wire 3</text>
    <circle cx="520" cy="665" r="6" class="hole"/><text x="536" y="670" class="tiny">24e wire 4</text>
    <circle cx="520" cy="685" r="6" class="hole"/><text x="536" y="690" class="tiny">25e wire 5</text>
    <circle cx="520" cy="705" r="6" class="hole"/><text x="536" y="710" class="tiny">26e wire 6</text>
    <circle cx="850" cy="605" r="6" class="hole"/><text x="866" y="610" class="tiny">27e wire 7</text>
    <circle cx="850" cy="625" r="6" class="hole"/><text x="866" y="630" class="tiny">28e wire 8</text>
  </g>

  <path d="M336 536 C410 545 470 605 520 605" class="wire-purple"/>
  <path d="M336 568 C410 570 470 625 520 625" class="wire-purple"/>
  <path d="M336 600 C410 595 470 645 520 645" class="wire-purple"/>
  <path d="M336 632 C410 620 470 665 520 665" class="wire-purple"/>
  <path d="M150 536 C280 650 430 685 520 685" class="wire-gray"/>
  <path d="M150 568 C280 674 430 705 520 705" class="wire-gray"/>
  <path d="M150 600 C350 700 700 605 850 605" class="wire-gray"/>
  <path d="M150 632 C350 725 710 625 850 625" class="wire-gray"/>

  <path d="M1100 250 C1010 585 770 605 520 605" class="wire-purple"/>
  <path d="M1128 250 C1030 590 780 625 520 625" class="wire-purple"/>
  <path d="M1156 250 C1050 595 790 645 520 645" class="wire-purple"/>
  <path d="M1184 250 C1070 600 800 665 520 665" class="wire-purple"/>
  <path d="M1212 250 C1090 605 810 685 520 685" class="wire-gray"/>
  <path d="M1240 250 C1110 610 820 705 520 705" class="wire-gray"/>
  <path d="M1268 250 C1130 615 930 605 850 605" class="wire-gray"/>
  <path d="M1296 250 C1150 620 940 625 850 625" class="wire-gray"/>

  <rect x="48" y="800" width="1304" height="56" rx="8" fill="#ffffff" stroke="#ccd6df"/>
  <text x="70" y="824" class="small">Power flow: Mega 5V -> red + rail. Mega GND -> blue - rail. LEDs and buzzer return to blue - rail.</text>
  <text x="70" y="846" class="small">Signal flow: Mega pins 2,3,4,5 -> LED rows 6,8,10,12. Mega pin 9 -> buzzer row 16. Keypad wires 1-8 -> rows 21-28 -> Mega pins 22,24,26,28,30,32,34,36.</text>
</svg>
